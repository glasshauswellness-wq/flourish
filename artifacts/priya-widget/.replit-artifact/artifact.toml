kind = "web"
previewPath = "/priya-widget/"
title = "Priya – The Sovereign Circle Widget"
version = "1.0.0"
id = "artifacts/priya-widget"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/priya-widget/" ]
localPort = 21571

[services.development]
run = "pnpm --filter @workspace/priya-widget run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/priya-widget", "run", "build" ]
publicDir = "artifacts/priya-widget/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21571"
BASE_PATH = "/priya-widget/"
