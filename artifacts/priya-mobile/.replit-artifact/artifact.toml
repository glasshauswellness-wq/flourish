kind = "mobile"
previewPath = "/priya-mobile/"
title = "Priya — The Sovereign Circle (Mobile)"
version = "1.0.0"
id = "artifacts/priya-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/priya-mobile/" ]
localPort = 20816

[services.development]
run = "pnpm --filter @workspace/priya-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/priya-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/priya-mobile", "run", "serve" ]

[services.env]
PORT = "20816"
BASE_PATH = "/priya-mobile/"
